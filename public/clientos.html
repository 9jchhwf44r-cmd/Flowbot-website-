<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkWave — Client OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070c;
    --bg-elev:#0e0e17;
    --bg-elev2:#13131f;
    --border:#1e1f2e;
    --border-soft:#191a26;
    --text:#f2f2f6;
    --text-dim:#9393a6;
    --text-dimmer:#5c5c70;
    --blue:#5b7cfa;
    --purple:#9457f5;
    --grad:linear-gradient(90deg,#5b7cfa,#9457f5);
    --green:#3ddc84;
    --amber:#f5b95b;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
  ::selection{background:rgba(91,124,250,.35);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #shell{display:flex;min-height:100vh;}

  /* SIDEBAR */
  #sidebar{
    width:246px;flex:none;background:var(--bg-elev);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 14px;
    overflow-x:hidden;
  }
  .logo{display:flex;align-items:baseline;gap:6px;padding:2px 6px 4px;white-space:nowrap;}
  .logo b{font-family:'Space Grotesk';font-size:17px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .logo span{font-size:10.5px;color:var(--text-dimmer);}
  .nav-group{margin-top:20px;}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dimmer);padding:0 10px;margin-bottom:7px;font-weight:600;}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);
    color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;
    border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav-item:hover{background:var(--bg-elev2);color:var(--text);}
  .nav-item.active{background:var(--bg-elev2);color:var(--text);border-color:var(--border-soft);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .nav-item span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-icon{width:15px;text-align:center;opacity:.85;flex:none;}
  .client-list{max-height:240px;overflow-y:auto;overflow-x:hidden;}
  #sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border-soft);font-size:10px;color:var(--text-dimmer);line-height:1.5;}

  /* MAIN */
  #main{flex:1;min-width:0;padding:34px 40px;max-width:1180px;}
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:22px;}
  .page-head p{color:var(--text-dim);margin-top:5px;font-size:13.5px;}
  .btn{
    background:var(--bg-elev2);color:var(--text);border:1px solid var(--border);
    padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  }
  .btn:hover{border-color:#31324a;}
  .btn-primary{background:var(--grad);border:none;color:#0a0a12;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{background:transparent;border:1px solid #3a1f24;color:#e88;}
  .btn-ghost{background:transparent;border:1px solid var(--border);}
  .row{display:flex;gap:10px;align-items:center;}

  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .num{font-family:'Space Grotesk';font-size:26px;font-weight:700;}
  .stat-card .lbl{color:var(--text-dim);font-size:12px;margin-top:2px;}

  /* table */
  .panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dimmer);padding:12px 16px;border-bottom:1px solid var(--border);}
  td{padding:13px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  tr.rowlink:hover{background:var(--bg-elev2);cursor:pointer;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--border);}
  .badge-basic{color:var(--text-dim);}
  .badge-business{color:#a9bafc;border-color:#31396b;background:rgba(91,124,250,.1);}
  .badge-pro{color:#ecd9ff;border-color:#5a3b8c;background:linear-gradient(90deg,rgba(91,124,250,.14),rgba(148,87,245,.18));}
  .empty{padding:50px 20px;text-align:center;color:var(--text-dimmer);}

  /* form */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:16px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text-dim);}
  .hint{font-size:11.5px;color:var(--text-dimmer);margin-top:5px;}
  input[type=text],input[type=email],input[type=tel],select,textarea{
    width:100%;background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  textarea{resize:vertical;min-height:70px;}
  .pkg-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pkg-card{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;cursor:pointer;}
  .pkg-card b{display:block;font-size:14px;margin-bottom:3px;}
  .pkg-card span{font-size:11.5px;color:var(--text-dim);}
  .pkg-card.sel{border-color:var(--blue);background:rgba(91,124,250,.08);}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* client detail */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
  .detail-head h1{font-size:23px;margin-bottom:6px;}
  .detail-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start;}
  .card-title{font-size:12.5px;font-weight:700;margin-bottom:13px;color:var(--text-dim);letter-spacing:.01em;}

  /* chat */
  .chat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .avatar{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0a12;font-size:14px;flex:none;}
  .chat-head .who b{display:block;font-size:13.5px;}
  .chat-head .who .status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;}
  .chat-head .status .d{width:6px;height:6px;background:var(--green);border-radius:50%;}
  #chatbody{height:380px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;}
  .bubble.assistant{background:var(--bg-elev2);border:1px solid var(--border-soft);align-self:flex-start;border-bottom-left-radius:3px;}
  .bubble.user{background:var(--grad);color:#0a0a12;font-weight:500;align-self:flex-end;border-bottom-right-radius:3px;}
  .bubble.event{align-self:center;background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.3);color:#8fe6b4;font-size:12px;padding:6px 12px;}
  .bubble.err{align-self:center;background:rgba(232,136,136,.08);border:1px solid rgba(232,136,136,.3);color:#e88;font-size:12px;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:10px 13px;}
  .typing span{width:5px;height:5px;background:var(--text-dimmer);border-radius:50%;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
  .chat-input input{flex:1;}
  .chat-input button{background:var(--grad);border:none;color:#0a0a12;padding:0 16px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;}
  .chat-input button:disabled{opacity:.5;}
  .suggest-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px;}
  .suggest{font-size:11.5px;color:var(--text-dim);border:1px solid var(--border);padding:5px 10px;border-radius:99px;}
  .suggest:hover{border-color:var(--blue);color:var(--text);}

  .side-panel{display:flex;flex-direction:column;gap:20px;}

  .tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--blue);}

  .post-card{background:var(--bg-elev2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:13px;margin-bottom:10px;font-size:13px;line-height:1.55;white-space:pre-wrap;}
  .post-card .post-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .site-preview-wrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fff;height:480px;}
  .site-preview-wrap iframe{width:100%;height:100%;border:none;}
  .box{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border-soft);}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--text-dimmer);flex:none;}
  .kv span:last-child{text-align:right;color:var(--text);}
  pre.embed{
    background:#050508;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px;font-size:12px;overflow-x:auto;color:#9fd3a3;white-space:pre-wrap;word-break:break-all;
  }
  .warn{font-size:11.5px;color:var(--amber);margin-top:10px;line-height:1.5;border-left:2px solid var(--amber);padding-left:9px;}
  .analyze-summary{font-size:12.5px;color:var(--text-dim);line-height:1.6;background:rgba(61,220,132,.06);border:1px solid rgba(61,220,132,.25);border-radius:var(--radius-sm);padding:11px 13px;}
  .analyze-summary b{color:var(--text);}
  .analyze-summary ul{margin:6px 0 0 18px;padding:0;}
  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .report-block{border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;line-height:1.6;border:1px solid var(--border);}
  .report-block b{display:block;margin-bottom:6px;font-size:12.5px;}
  .report-block ul{margin:0 0 0 16px;padding:0;color:var(--text-dim);}
  .report-good{background:rgba(61,220,132,.06);border-color:rgba(61,220,132,.25);}
  .report-good b{color:#7fe6a8;}
  .report-bad{background:rgba(232,136,136,.06);border-color:rgba(232,136,136,.25);}
  .report-bad b{color:#e88;}
  .report-tech{background:rgba(245,185,91,.06);border-color:rgba(245,185,91,.25);}
  .report-tech b{color:var(--amber);}
  .report-idea{background:rgba(91,124,250,.06);border-color:rgba(91,124,250,.25);}
  .report-idea b{color:#a9bafc;}
  @media (max-width:880px){.report-grid{grid-template-columns:1fr;}}
  .resv-item{padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .resv-item:last-child{border-bottom:none;}
  .resv-item b{font-size:13px;}
  .resv-item .meta{color:var(--text-dimmer);font-size:11.5px;margin-top:2px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--bg-elev2);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-box{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:360px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .modal-msg{font-size:13.5px;line-height:1.5;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  @media (max-width:880px){
    #shell{flex-direction:column;}
    #sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:14px;}
    .client-list{display:none;}
    #main{padding:20px;}
    .form-grid,.detail-grid,.stat-grid,.pkg-choices{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar">
    <div class="logo"><b>TALKWAVE</b><span>Client OS</span></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-dashboard" onclick="go('dashboard')"><span class="nav-icon">▦</span> Dashboard</div>
      <div class="nav-item" id="nav-intake" onclick="go('intake')"><span class="nav-icon">＋</span> Nieuwe klant</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">Klanten</div>
      <div class="client-list" id="client-nav-list"></div>
    </div>
    <div id="sidebar-foot">Klantgegevens &amp; reserveringen staan in Netlify Blobs, alleen bereikbaar via dit wachtwoord-beveiligde beheerpaneel.</div>
  </div>
  <div id="main"></div>
</div>

<script>
/* ---------- state ---------- */
const state = { view:'dashboard', clientId:null, clients:{}, clientIds:[], chat:{}, social:{}, posts:{}, website:{}, followup:{}, detailTab:{} };

const PACKAGES = {
  basic:    { label:'Basic',    canReserve:false, canSocialReply:false, canSocialPosts:false, canFollowup:false, cls:'badge-basic'    },
  business: { label:'Business', canReserve:true,  canSocialReply:true,  canSocialPosts:false, canFollowup:false, cls:'badge-business' },
  pro:      { label:'Pro',      canReserve:true,  canSocialReply:true,  canSocialPosts:true,  canFollowup:true,  cls:'badge-pro'      }
};

function genId(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ---------- storage helpers ----------
   Origineel gebruikte window.storage (alleen beschikbaar binnen Claude-
   artifacts). Hier vervangen door fetches naar /api/clientos/store, dat
   server-side Netlify Blobs gebruikt — werkt op de echte site, achter het
   Tide-wachtwoord. */
async function safeGet(key){
  try{
    const res = await fetch('/api/clientos/store?key=' + encodeURIComponent(key));
    const data = await res.json();
    return (data && data.value != null) ? data.value : null;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  try{
    const res = await fetch('/api/clientos/store', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key, value })
    });
    return await res.json();
  }catch(e){ console.error('storage set failed', e); return null; }
}

async function loadClientIndex(){
  const raw = await safeGet('clients-index', true);
  state.clientIds = raw ? JSON.parse(raw) : [];
}
async function loadClient(id){
  if(state.clients[id]) return state.clients[id];
  const raw = await safeGet('client:'+id, true);
  if(!raw) return null;
  const c = JSON.parse(raw);
  state.clients[id] = c;
  return c;
}
async function loadAllClients(){
  await loadClientIndex();
  await Promise.all(state.clientIds.map(loadClient));
}
async function saveClient(c){
  await safeSet('client:'+c.id, JSON.stringify(c), true);
  state.clients[c.id] = c;
  if(!state.clientIds.includes(c.id)){
    state.clientIds.unshift(c.id);
    await safeSet('clients-index', JSON.stringify(state.clientIds), true);
  }
}
async function deleteClient(id){
  try{
    await fetch('/api/clientos/store?key=' + encodeURIComponent('client:'+id), { method:'DELETE' });
  }catch(e){}
  state.clientIds = state.clientIds.filter(x=>x!==id);
  delete state.clients[id];
  await safeSet('clients-index', JSON.stringify(state.clientIds));
}

async function loadReservationIndex(clientId){
  const raw = await safeGet('res-index:'+clientId, true);
  return raw ? JSON.parse(raw) : [];
}
async function loadReservations(clientId){
  const ids = await loadReservationIndex(clientId);
  const items = await Promise.all(ids.map(async id=>{
    const raw = await safeGet('reservation:'+id, true);
    return raw ? JSON.parse(raw) : null;
  }));
  return items.filter(Boolean).sort((a,b)=> b.createdAt - a.createdAt);
}
async function saveReservation(clientId, data){
  const id = 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const rec = { id, clientId, ...data, createdAt: Date.now() };
  await safeSet('reservation:'+id, JSON.stringify(rec), true);
  const idx = await loadReservationIndex(clientId);
  idx.unshift(id);
  await safeSet('res-index:'+clientId, JSON.stringify(idx), true);
  return rec;
}

/* ---------- routing / render ---------- */
async function go(view, id){
  state.view = view;
  state.clientId = id || null;
  await render();
}
window.go = go;

async function render(){
  await renderSidebar();
  const main = document.getElementById('main');
  if(state.view==='dashboard') return renderDashboard(main);
  if(state.view==='intake') return renderIntake(main);
  if(state.view==='client') return renderClientDetail(main, state.clientId);
}

async function renderSidebar(){
  document.getElementById('nav-dashboard').className = 'nav-item' + (state.view==='dashboard'?' active':'');
  document.getElementById('nav-intake').className = 'nav-item' + (state.view==='intake'?' active':'');
  const list = document.getElementById('client-nav-list');
  if(state.clientIds.length===0){ list.innerHTML=''; return; }
  list.innerHTML = state.clientIds.map(id=>{
    const c = state.clients[id]; if(!c) return '';
    const pkg = PACKAGES[c.package];
    const dotColor = c.package==='pro' ? 'var(--purple)' : c.package==='business' ? 'var(--blue)' : 'var(--text-dimmer)';
    const active = (state.view==='client' && state.clientId===id) ? ' active' : '';
    return `<div class="nav-item${active}" onclick="go('client','${id}')">
      <span class="dot" style="background:${dotColor}"></span> ${esc(c.name)}
    </div>`;
  }).join('');
}

/* ---------- DASHBOARD ---------- */
async function renderDashboard(main){
  main.innerHTML = `<div class="page-head"><h1>Dashboard</h1><p>Overzicht van alle klanten en hun AI-assistent.</p></div>
  <div id="stat-grid" class="stat-grid"></div>
  <div class="panel"><div id="client-table"></div></div>`;

  const counts = { basic:0, business:0, pro:0 };
  let totalRes = 0;
  for(const id of state.clientIds){
    const c = state.clients[id]; if(!c) continue;
    counts[c.package] = (counts[c.package]||0)+1;
    totalRes += (await loadReservationIndex(id)).length;
  }
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="num">${state.clientIds.length}</div><div class="lbl">Klanten totaal</div></div>
    <div class="stat-card"><div class="num">${counts.business||0}+${counts.pro||0}</div><div class="lbl">Business / Pro klanten</div></div>
    <div class="stat-card"><div class="num">${totalRes}</div><div class="lbl">Reserveringen via AI</div></div>
    <div class="stat-card"><div class="num">${counts.basic||0}</div><div class="lbl">Basic klanten</div></div>`;

  const rows = state.clientIds.map(id=>state.clients[id]).filter(Boolean);
  const tableDiv = document.getElementById('client-table');
  if(rows.length===0){
    tableDiv.innerHTML = `<div class="empty">Nog geen klanten. <a href="#" onclick="go('intake');return false;" style="color:var(--blue)">Voeg je eerste klant toe →</a></div>`;
    return;
  }
  let html = `<table><thead><tr><th>Bedrijf</th><th>Sector</th><th>Pakket</th><th>Reserveren</th><th>Toegevoegd</th></tr></thead><tbody>`;
  for(const c of rows){
    const pkg = PACKAGES[c.package];
    const resCount = (await loadReservationIndex(c.id)).length;
    html += `<tr class="rowlink" onclick="go('client','${c.id}')">
      <td><b>${esc(c.name)}</b></td>
      <td style="color:var(--text-dim)">${esc(c.sector||'—')}</td>
      <td><span class="badge ${pkg.cls}">${pkg.label}</span></td>

async function handleAnalyzeUrl(){
  const urlInput = document.getElementById('analyze-url');
  const url = urlInput.value.trim();
  if(!url){ toast('Vul een website-URL in'); urlInput.focus(); return; }
  const btn = document.getElementById('analyze-btn');
  const resultBox = document.getElementById('analyze-result');
  btn.disabled = true; btn.textContent = 'Bezig met analyseren...';
  resultBox.innerHTML = `<div class="hint">De AI haalt de opgegeven pagina op en stelt op basis daarvan een analyse op — dit kan 10–30 seconden duren...</div>`;
  try{
    const res = await withTimeout(fetch('/api/clientos/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url })
    }), 50000);
    const parsed = await res.json();
    if(!res.ok) throw new Error(parsed.error || 'Analyse mislukt');

    document.getElementById('f-name').value = parsed.name || '';
    document.getElementById('f-sector').value = parsed.sector || '';
    document.getElementById('f-website').value = url;
    document.getElementById('f-desc').value = parsed.description || '';
    document.getElementById('f-services').value = parsed.services || '';
    document.getElementById('f-hours').value = parsed.hours || '';
    document.getElementById('f-address').value = parsed.address || '';
    document.getElementById('f-phone').value = parsed.phone || '';
    document.getElementById('f-email').value = parsed.email || '';

    const list = (title, items, cls) => (Array.isArray(items) && items.length)
      ? `<div class="report-block ${cls}"><b>${title}</b><ul>${items.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>` : '';

    resultBox.innerHTML = `
      <div class="analyze-summary" style="margin-bottom:10px;">${esc(parsed.summary||'')}</div>
      <div class="report-grid">
        ${list('✓ Sterke punten huidige website', parsed.sterke_punten, 'report-good')}
        ${list('✗ Zwakke punten / gemiste kansen', parsed.zwakke_punten, 'report-bad')}
        ${list('⚙ Technische observaties', parsed.technische_observaties, 'report-tech')}
        ${list('💡 Kansen voor AI-automatisering', parsed.opportunities, 'report-idea')}
      </div>
      <div class="hint" style="margin-top:8px">Deze analyse is gebaseerd op het doorlezen van de opgegeven pagina zelf — geen bredere webzoekopdracht, geen externe reviews, en geen geautomatiseerde technische audit (dus geen broken-link-scan of paginasnelheidstest).</div>`;
    toast('Formulier automatisch ingevuld — controleer voordat je aanmaakt');
  }catch(err){
    console.error('Website-analyse mislukt:', err);
    resultBox.innerHTML = `<div class="hint" style="color:#e88">Analyse mislukt (${esc(err.message||'onbekende fout')}). Vul het formulier handmatig in of probeer het nog eens.</div>`;
  }finally{
    btn.disabled = false; btn.textContent = 'Analyseer website →';
  }
}
window.handleAnalyzeUrl = handleAnalyzeUrl;

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout na '+ms+'ms')), ms))
  ]);
}

async function handleCreateClient(){
  const btn = document.querySelector('#intake-form .btn-primary');
  try{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ toast('Vul minimaal een bedrijfsnaam in'); document.getElementById('f-name').focus(); return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Bezig...'; }
    const c = {
      id: genId(),
      name,
      sector: document.getElementById('f-sector').value.trim(),
      website: document.getElementById('f-website').value.trim(),
      package: window._selectedPkg || 'business',
      websiteAddon: !!document.getElementById('f-website-addon').checked,
      description: document.getElementById('f-desc').value.trim(),
      services: document.getElementById('f-services').value.trim(),
      hours: document.getElementById('f-hours').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      extra: document.getElementById('f-extra').value.trim(),
      createdAt: Date.now()
    };
    try{
      await withTimeout(saveClient(c), 4000);
    }catch(storageErr){
      console.error('Opslaan duurde te lang of mislukte, ga toch door:', storageErr);
      state.clients[c.id] = c; // zorg dat de app lokaal in elk geval verder kan
      if(!state.clientIds.includes(c.id)) state.clientIds.unshift(c.id);
    }
    toast(`${name} toegevoegd`);
    await go('client', c.id);
  }catch(err){
    console.error('Aanmaken klant mislukt:', err);
    toast('Er ging iets mis bij het aanmaken — zie console voor details');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Klant aanmaken →'; }
  }
}

- Identieke afgeronde kaartjes met allemaal dezelfde zachte grijze schaduw, of een gradient-wasje als decoratie.
- ALL-CAPS "eyebrow"-labeltjes boven koppen, meta-tekst met bullet-punten (A · B · C), labels met een gedachtestreepje ("WOORD — fragment"), een pijltje (→) achter elke link/knoptekst.

  const guidance = compact

${antiPatterns}
Eén zelfstandig HTML-bestand, inline <style>, mag Google Fonts CDN gebruiken. Antwoord UITSLUITEND met de ruwe HTML, beginnend met <!DOCTYPE html> en eindigend met </html> — geen uitleg, geen codeblok.`
    : `Je bent de design lead van een klein studio die bekendstaat om een unieke visuele identiteit per klant — nooit een sjabloon, en deze klant heeft eerder een generiek voorstel afgewezen. Bouw een volledige, originele één-pagina marketingwebsite (HTML) die je zou durven laten zien als portfolio-stuk. Antwoord UITSLUITEND met de ruwe HTML, beginnend met <!DOCTYPE html> en eindigend met </html> — geen markdown-codeblok, geen uitleg ervoor of erna.

DENK EERST NA (intern, schrijf dit niet uit): wat is het concrete, tastbare karakter van dít bedrijf — de sector, de plek, het gevoel? Baseer elke ontwerpkeuze hierop, niet op wat "professioneel" of "modern" hoort te zijn in het algemeen.

${antiPatterns}

VERPLICHTE ONTWERPKEUZES, elk concreet afgeleid van dít specifieke bedrijf:

- Eén lettertype-paar (display + body) dat de persoonlijkheid van de pagina draagt — gebruik het display-lettertype ook echt als vormgevend element, niet als neutrale drager van tekst.

WERKWIJZE: CSS-budget max. ~150 regels — een paar sterke, doordachte keuzes in plaats van veel decoratie. Elke sectie moet volledig zijn met echte, concrete tekst; geen sectie mag leeg of half afgemaakt zijn.

Verder: volledig responsive, goed contrast, concrete copy ALLEEN gebaseerd op de info hieronder (verzin geen feiten), één zelfstandig HTML-bestand met inline <style>, Google Fonts CDN toegestaan.

TER ILLUSTRATIE — dit is een eerder goedgekeurd voorbeeld van het gewenste kwaliteitsniveau en de gewenste aanpak (concreet eigen palet, doordachte typografie, een informatief signature-element, editorial in plaats van kaartjes-lay-out, bewuste uitlijning). Kopieer dit NIET letterlijk en gebruik deze kleuren/lay-out/tekst niet opnieuw — het is voor een ander bedrijf (een watersportcentrum). Vertaal alleen de AANPAK naar een volledig eigen, passend ontwerp voor het bedrijf hieronder:

async function requestWebsiteHtml(prompt, maxTokens, timeoutMs){
  const body = { model:'claude-sonnet-4-6', max_tokens:maxTokens, messages:[{role:'user', content:prompt}] };
  const res = await withTimeout(fetch('/api/clientos/ai', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  }), timeoutMs);
  const data = await res.json();
  if(data && data.stop_reason === 'max_tokens'){
    throw new Error('Antwoord werd afgebroken door de tokenlimiet (waarschijnlijk onvolledige pagina)');
  }
  let html = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  html = html.replace(/```html/gi,'').replace(/```/g,'').trim();
  if(!html.toLowerCase().includes('<html')) throw new Error('Geen geldige HTML ontvangen');
  if(!html.toLowerCase().includes('</html>')) throw new Error('Pagina lijkt afgebroken (geen afsluitende </html>)');
  const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  const bodyText = bodyMatch ? bodyMatch[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim() : '';
  if(bodyText.length < 250) throw new Error('Pagina-inhoud is te kort — waarschijnlijk missen er secties');
  const headingCount = (html.match(/<h[23][ >]/gi) || []).length;
  if(headingCount < 2) throw new Error('Te weinig secties gevonden — pagina is waarschijnlijk onvolledig');
  return html;
}

async function generateWebsite(id){
  const c = state.clients[id];
  const w = state.website[id];
  const btn = document.getElementById('site-gen-btn');
  const status = document.getElementById('site-status');
  btn.disabled = true; btn.textContent = 'Bezig met bouwen...';

  let seconds = 0;
  const ticker = setInterval(()=>{
    seconds++;
    const s = document.getElementById('gen-timer');
    if(s) s.textContent = seconds;
  }, 1000);
  status.innerHTML = `<div class="hint">De AI ontwerpt en schrijft de website (<span id="gen-timer">0</span>s)...</div>`;

  let usedFallback = false;
  try{
    let html;
    try{
      html = await requestWebsiteHtml(buildWebsitePrompt(c, false), 6000, 85000);
    }catch(firstErr){
      console.error('Eerste poging mislukt of onvolledig, val terug op compactere versie:', firstErr);
      status.innerHTML = `<div class="hint">Eerste versie kwam niet compleet uit de bus — probeer een compactere versie (<span id="gen-timer">${seconds}</span>s)...</div>`;
      try{
        html = await requestWebsiteHtml(buildWebsitePrompt(c, true), 3500, 45000);
      }catch(secondErr){
        console.error('Ook compactere versie mislukt, gebruik gegarandeerde vaste template:', secondErr);
        status.innerHTML = `<div class="hint">Ook de compactere versie lukte niet — gegarandeerde standaardversie wordt gebruikt (geen AI-afhankelijkheid)...</div>`;
        html = buildStaticFallbackSite(c);
        usedFallback = true;
      }
    }
    w.html = html;
    status.innerHTML = usedFallback
      ? `<div class="analyze-summary" style="border-color:rgba(245,185,91,.3);background:rgba(245,185,91,.06);">⚠️ De AI-ontwerpversie lukte niet, dus dit is de gegarandeerde standaardversie — simpeler qua vormgeving, maar altijd compleet en werkend. Klik gerust op "Opnieuw genereren" om de AI-versie nogmaals te proberen.</div>`
      : `<div class="analyze-summary">✅ Website gegenereerd. Bekijk de preview hieronder of download het bestand.</div>`;
    renderSitePreview(id);
    toast(usedFallback ? 'Standaardversie gebruikt (AI-versie lukte niet)' : 'Website gegenereerd');
  }catch(err){
    console.error('Website generatie definitief mislukt:', err);
    status.innerHTML = `<div class="hint" style="color:#e88">Genereren mislukt (${esc(err.message||'onbekende fout')}). Probeer het nog eens.</div>`;
  }finally{
    clearInterval(ticker);
    btn.disabled = false; btn.textContent = state.website[id].html ? 'Opnieuw genereren →' : 'Genereer website →';
  }
}
window.generateWebsite = generateWebsite;

async function editWebsite(id){
  const w = state.website[id];
  if(!w || !w.html){ toast('Genereer eerst een website'); return; }
  const input = document.getElementById('edit-instruction');
  if(!input) return;
  const instruction = input.value.trim();
  if(!instruction){ toast('Beschrijf eerst wat er moet veranderen'); input.focus(); return; }
  const btn = document.getElementById('edit-btn');
  const status = document.getElementById('edit-status');
  if(btn){ btn.disabled = true; btn.textContent = 'Bezig...'; }
  if(status) status.innerHTML = `<div class="hint" style="margin-top:8px">De AI past de website aan...</div>`;
  try{
    const html = await requestWebsiteHtml(buildEditPrompt(w.html, instruction), 6000, 70000);
    w.previousHtml = w.html;
    w.html = html;
    input.value = '';
    toast('Wijziging toegepast');
    const el = document.getElementById('tab-content');
    if(el) renderWebsiteTab(el, id, state.clients[id]);
  }catch(err){
    console.error('Wijziging mislukt:', err);
    const status2 = document.getElementById('edit-status');
    if(status2) status2.innerHTML = `<div class="hint" style="color:#e88;margin-top:8px">Wijziging mislukt (${esc(err.message||'onbekende fout')}). De website is ongewijzigd gebleven — probeer het opnieuw, eventueel iets anders geformuleerd.</div>`;
  }finally{
    const btn2 = document.getElementById('edit-btn');
    if(btn2){ btn2.disabled = false; btn2.textContent = 'Toepassen →'; }
  }
}
window.editWebsite = editWebsite;

function revertWebsite(id){
  const w = state.website[id];
  if(!w || !w.previousHtml) return;
  w.html = w.previousHtml;
  w.previousHtml = null;
  toast('Vorige versie hersteld');
  const el = document.getElementById('tab-content');
  if(el) renderWebsiteTab(el, id, state.clients[id]);
}
window.revertWebsite = revertWebsite;

function renderSitePreview(id){
  const area = document.getElementById('site-preview-area');
  if(!area) return;
  const w = state.website[id];
  area.innerHTML = `
    <div class="site-preview-wrap"><iframe id="site-iframe" sandbox="allow-same-origin"></iframe></div>
    <div id="site-preview-warning"></div>
    <div class="row" style="margin-top:10px;gap:8px;">
      <button class="btn" style="flex:1" onclick="downloadWebsite('${id}')">Download HTML-bestand</button>
      <button class="btn btn-primary" style="flex:1" onclick="openWebsiteInNewTab('${id}')">Open in nieuw tabblad →</button>
    </div>
    <div class="warn">Dit HTML-bestand is echt en volledig — download het en zet het direct online (bijv. via Vercel, Netlify of de eigen hosting van de klant). Voor tekstwijzigingen: pas de bedrijfsinfo aan en genereer opnieuw, of bewerk de HTML rechtstreeks.</div>`;
  const frame = document.getElementById('site-iframe');
  if(frame){
    frame.onload = ()=>{
      try{
        const doc = frame.contentDocument;
        const len = doc && doc.body ? doc.body.innerText.trim().length : 0;
        if(!doc || len < 15){
          const warnEl = document.getElementById('site-preview-warning');
          if(warnEl) warnEl.innerHTML = `<div class="hint" style="color:var(--amber);margin:8px 0 0">De voorvertoning hierboven blijft in dit venster soms leeg (een bekende beperking van ingesloten previews). Klik "Open in nieuw tabblad" — daar werkt de website altijd.</div>`;
        }
      }catch(e){ console.warn('Kon preview-inhoud niet controleren:', e); }
    };
    frame.srcdoc = w.html;
  }
}

function openWebsiteInNewTab(id){
  const w = state.website[id];
  if(!w || !w.html){ toast('Genereer eerst een website'); return; }
  const blob = new Blob([w.html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}
window.openWebsiteInNewTab = openWebsiteInNewTab;

function downloadWebsite(id){
  const w = state.website[id];
  const c = state.clients[id];
  if(!w.html) return;
  const blob = new Blob([w.html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (c.name || 'website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
window.downloadWebsite = downloadWebsite;

      <div class="hint" style="margin-bottom:12px">Genereert een echte, kant-en-klare 3-stappen e-mailreeks (dag 0, 1 en 3) voor een lead die niet reageert — geschreven door AI, specifiek voor dit bedrijf.</div>
      <button class="btn btn-primary" id="followup-btn" onclick="generateFollowup('${id}')">${f.steps ? 'Opnieuw genereren →' : 'Genereer opvolgreeks →'}</button>
      <div id="followup-list" style="margin-top:14px"></div>
      <div class="warn">Let op: dit genereert de tekst van de reeks — echt en direct bruikbaar. Het automatisch ná 0/1/3 dagen daadwerkelijk versturen vereist een gekoppelde mailservice + scheduler (bijv. via Make.com), wat buiten deze demo-omgeving valt.</div>
    </div>`;

}

async function generateFollowup(id){
  const c = state.clients[id];
  const f = state.followup[id];
  const btn = document.getElementById('followup-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Bezig...'; }
  try{
    const prompt = `Schrijf een 3-stappen automatische e-mail-opvolgreeks voor een lead die niet reageert, voor dit bedrijf:
Bedrijf: ${c.name}${c.sector?` (${c.sector})`:''}
${c.description?`Omschrijving: ${c.description}\n`:''}${c.extra?`Toon/instructies: ${c.extra}\n`:''}
Stap 1 (dag 0): directe bevestiging dat het bericht is ontvangen.
Stap 2 (dag 1): vriendelijke persoonlijke follow-up.
Stap 3 (dag 3): laatste, warme reminder met duidelijke call-to-action.

Antwoord UITSLUITEND met geldige JSON: {"steps":[{"dag":"Dag 0","titel":"...","tekst":"..."},{"dag":"Dag 1","titel":"...","tekst":"..."},{"dag":"Dag 3","titel":"...","tekst":"..."}]}. Geen markdown, geen uitleg.`;
    const body = { model:'claude-sonnet-4-6', max_tokens:900, messages:[{role:'user', content:prompt}] };
    const res = await withTimeout(fetch('/api/clientos/ai', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }), 25000);
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    const clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(clean);
    f.steps = Array.isArray(parsed.steps) ? parsed.steps : null;
    if(!f.steps) throw new Error('Geen geldige reeks ontvangen');
    renderFollowupList(id);
    toast('Opvolgreeks gegenereerd');
  }catch(err){
    console.error('Opvolgreeks genereren mislukt:', err);
    toast('Genereren mislukt, probeer het nog eens');
  }finally{
    const btn2 = document.getElementById('followup-btn');
    if(btn2){ btn2.disabled = false; btn2.textContent = state.followup[id].steps ? 'Opnieuw genereren →' : 'Genereer opvolgreeks →'; }
  }
}
window.generateFollowup = generateFollowup;

function buildSocialSystemPrompt(c){
  return `Je bent de social-media-stem van "${c.name}"${c.sector?` (${c.sector})`:''}. Je reageert op comments/DM's op Instagram/Facebook namens dit bedrijf.

BEDRIJFSINFORMATIE:
${c.description ? `Omschrijving: ${c.description}\n` : ''}${c.services ? `Diensten & prijzen:\n${c.services}\n` : ''}${c.hours ? `Openingstijden: ${c.hours}\n` : ''}${c.phone ? `Telefoon/WhatsApp: ${c.phone}\n` : ''}${c.extra ? `Extra instructies: ${c.extra}\n` : ''}
STIJL: kort (max 2-3 zinnen), casual en gastvrij zoals social media dat vraagt, gerust een emoji waar passend — maar niet overdreven. Verzin geen info die hierboven niet staat; verwijs dan naar een DM of het contact van het bedrijf.`;
}

function renderSocialTab(el, id, c){
  const pkg = PACKAGES[c.package];
  el.innerHTML = `
    <div class="box" style="margin-bottom:16px;">
      <div class="card-title">💬 AI reageert op social media (comment/DM-simulator)</div>
      <div class="hint" style="margin-bottom:10px">Simuleer een comment of DM alsof je een klant bent — de AI reageert er echt op, in de stijl van dit bedrijf. (Dit is een simulatie: koppeling met een echt Instagram/Facebook-account vereist hun API-toegang, die hier niet beschikbaar is.)</div>
      <div id="socialbody" style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:10px;"></div>
      <div class="chat-input" style="padding:0;border:none;">

        <button id="social-send" onclick="sendSocial('${id}')">Stuur</button>
      </div>
    </div>

    <div class="box">
      <div class="card-title">✍️ Social Media Management — posts genereren</div>
      <div class="hint" style="margin-bottom:10px">Echte AI-tekstgeneratie — 3 kant-en-klare captions, direct te gebruiken of als vertrekpunt.</div>
      <div class="chat-input" style="padding:0;border:none;margin-bottom:12px;">

function renderSocialMessages(id){
  const box = document.getElementById('socialbody');
  if(!box) return;
  const social = state.social[id];
  let html = social.messages.length ? '' : `<div class="hint">Nog geen berichten — typ hieronder een reactie zoals een klant die zou plaatsen.</div>`;
  for(const m of social.messages){
    if(m.role==='user' && typeof m.content==='string'){
      html += `<div class="bubble user" style="align-self:flex-end">${esc(m.content)}</div>`;
    } else if(m.role==='assistant' && typeof m.content==='string'){
      html += `<div class="bubble assistant" style="align-self:flex-start">${esc(m.content)}</div>`;
    }
  }
  if(social.loading) html += `<div class="typing"><span></span><span></span><span></span></div>`;
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

async function sendSocial(id){
  const input = document.getElementById('social-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const c = state.clients[id];
  const social = state.social[id];
  if(social.loading) return;
  social.messages.push({ role:'user', content:text });
  input.value='';
  social.loading = true;
  renderSocialMessages(id);
  const sendBtn0 = document.getElementById('social-send');
  if(sendBtn0) sendBtn0.disabled = true;
  try{
    const body = {
      model:'claude-sonnet-4-6',
      max_tokens:300,
      system: buildSocialSystemPrompt(c),
      messages: social.messages.filter(m=>typeof m.content==='string').map(m=>({role:m.role, content:m.content}))
    };
    const res = await withTimeout(fetch('/api/clientos/ai', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }), 20000);
    const data = await res.json();
    const text2 = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    social.messages.push({ role:'assistant', content: text2 || '(geen antwoord ontvangen)' });
  }catch(err){
    console.error('Social reply mislukt:', err);
    social.messages.push({ role:'assistant', content:'⚠️ Kon geen antwoord ophalen, probeer het nog eens.' });
  }
  social.loading = false;
  const sendBtn1 = document.getElementById('social-send');
  if(sendBtn1) sendBtn1.disabled = false;
  renderSocialMessages(id);
}
window.sendSocial = sendSocial;

Bedrijf: ${c.name}${c.sector?` (${c.sector})`:''}
${c.description?`Omschrijving: ${c.description}\n`:''}${c.services?`Diensten: ${c.services}\n`:''}
Antwoord UITSLUITEND met geldige JSON: {"posts":["caption 1","caption 2","caption 3"]}. Geen markdown, geen uitleg.`;
    const body = { model:'claude-sonnet-4-6', max_tokens:800, messages:[{role:'user', content:prompt}] };
    const res = await withTimeout(fetch('/api/clientos/ai', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }), 25000);
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();

function renderChatMessages(id){
  const box = document.getElementById('chatbody');
  if(!box) return;
  const chat = state.chat[id];
  let html = `<div class="bubble assistant">Hoi! Ik ben de AI-assistent van deze klant. Stel gerust een vrije vraag — ik lees mee met alles wat over dit bedrijf is ingevuld.</div>`;
  for(const m of chat.messages){
    if(m.role==='user' && typeof m.content==='string'){
      html += `<div class="bubble user">${esc(m.content)}</div>`;
    } else if(m.role==='assistant' && Array.isArray(m.content)){
      const text = m.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      if(text) html += `<div class="bubble assistant">${esc(text).replace(/\n/g,'<br>')}</div>`;
    } else if(m.role==='event'){
      html += `<div class="bubble event">${esc(m.content)}</div>`;
    }
  }
  if(chat.loading){
    html += `<div class="typing"><span></span><span></span><span></span></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

async function sendChat(id){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const chat = state.chat[id];
  if(chat.loading) return;
  chat.messages.push({ role:'user', content: text });
  input.value='';
  chat.loading = true;
  renderChatMessages(id);
  const sendBtn0 = document.getElementById('chat-send');
  if(sendBtn0) sendBtn0.disabled = true;
  await runTurn(id);
  chat.loading = false;
  const sendBtn1 = document.getElementById('chat-send');
  if(sendBtn1) sendBtn1.disabled = false;
  renderChatMessages(id);
}
window.sendChat = sendChat;

async function runTurn(id, depth){
  depth = depth || 0;
  if(depth > 3) return; // safety valve against runaway tool loops
  const c = state.clients[id];
  const chat = state.chat[id];
  const pkg = PACKAGES[c.package];

  // build API-shaped messages (user content must be plain string or content-block array)
  const apiMessages = chat.messages
    .filter(m => m.role==='user' || m.role==='assistant')
    .map(m => ({ role:m.role, content:m.content }));

  const body = {
    model:'claude-sonnet-4-6',
    max_tokens:1000,
    system: buildSystemPrompt(c),
    messages: apiMessages
  };
  if(pkg.canReserve) body.tools = [RESERVATION_TOOL];

  let data;
  try{
    const res = await fetch('/api/clientos/ai', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    data = await res.json();
  }catch(err){
    chat.messages.push({ role:'event', content:'Er ging iets mis bij het ophalen van een antwoord. Probeer het opnogen.' });
    return;
  }

  if(!data || !data.content){
    chat.messages.push({ role:'event', content:'Geen antwoord ontvangen — probeer het nog eens.' });
    return;
  }

  chat.messages.push({ role:'assistant', content: data.content });
  renderChatMessages(id);

  if(data.stop_reason === 'tool_use'){
    const toolBlocks = data.content.filter(b=>b.type==='tool_use');
    const resultBlocks = [];
    for(const tb of toolBlocks){
      if(tb.name === 'plaats_reservering'){
        const rec = await saveReservation(id, {
          naam: tb.input.naam,
          contact: tb.input.contact,
          activiteit: tb.input.activiteit,
          datum: tb.input.datum,
          aantal_personen: tb.input.aantal_personen,
          opmerkingen: tb.input.opmerkingen || ''
        });
        chat.messages.push({ role:'event', content:`✅ Reservering opgeslagen: ${rec.naam} — ${rec.activiteit} op ${rec.datum} (${rec.aantal_personen}p)` });
        resultBlocks.push({ type:'tool_result', tool_use_id: tb.id, content:'Reservering succesvol opgeslagen in het systeem.' });
        await refreshReservations(id, true);
      } else {
        resultBlocks.push({ type:'tool_result', tool_use_id: tb.id, content:'Onbekende actie.' });
      }
    }
    chat.messages.push({ role:'user', content: resultBlocks });
    renderChatMessages(id);
    await runTurn(id, depth+1);
  }
}

async function refreshReservations(id, enabled){
  const list = document.getElementById('resv-list');
  if(!list) return;
  if(!enabled){
    list.innerHTML = `<div class="hint">Dit pakket bevat geen reserveringsfunctie.</div>`;
    return;
  }
  const items = await loadReservations(id);
  if(items.length===0){
    list.innerHTML = `<div class="hint">Nog geen reserveringen. Probeer de chat: "Ik wil iets reserveren".</div>`;
    return;
  }
  list.innerHTML = items.map(r=>`
    <div class="resv-item">
      <b>${esc(r.naam)}</b> — ${esc(r.activiteit)}
      <div class="meta">${esc(r.datum)} · ${esc(String(r.aantal_personen))}p · ${esc(r.contact)}${r.opmerkingen?` · "${esc(r.opmerkingen)}"`:''}</div>
    </div>`).join('');
}

function copyEmbed(id){

function showConfirmModal(message, onConfirm){
  const existing = document.getElementById('confirm-modal-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'confirm-modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-msg">${esc(message)}</div>
      <div class="modal-actions">
        <button class="btn" id="confirm-cancel">Annuleren</button>
        <button class="btn btn-danger" id="confirm-ok">Verwijderen</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  document.getElementById('confirm-cancel').onclick = close;
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };
  document.getElementById('confirm-ok').onclick = ()=>{ close(); onConfirm(); };
}

async function onDeleteClient(id){
  const c = state.clients[id];
  if(!c) return;
  showConfirmModal(`Weet je zeker dat je "${c.name}" wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`, async ()=>{
    try{
      await withTimeout(deleteClient(id), 4000);
    }catch(err){
      console.error('Verwijderen duurde te lang of mislukte, toch lokaal opruimen:', err);
      state.clientIds = state.clientIds.filter(x=>x!==id);
      delete state.clients[id];
    }
    toast('Klant verwijderd');
    await go('dashboard');
  });
}
window.onDeleteClient = onDeleteClient;
